<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Social Media Privacy Checklist</title><link rel="stylesheet" href="/css/style.css"></head>
<body><header id="nav"></header>
<main class="wrap" style="padding-top:22px;max-width:900px">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px">
    <div><h1 style="margin-bottom:4px">Social Media Privacy Checklist</h1><div class="muted">Tick items as you complete them (saved only in this browser).</div></div>
    <div class="no-print" style="display:flex;gap:8px"><button class="btn" id="printBtn">🖨 Print</button><button class="btn" id="dlBtn">⬇ Download .txt</button></div></div>
  <div class="card" style="margin-bottom:14px"><div style="display:flex;align-items:center;gap:16px"><div id="ring"></div><div><div style="font-weight:700" id="pct"></div><div class="muted small">Review your privacy settings periodically — every few months.</div></div></div></div>
  <div style="display:grid;gap:8px" id="list"></div><p class="small muted" id="disc"></p>
</main><div id="footer"></div>
<script src="/js/common.js"></script><script src="/js/charts.js"></script><script src="/js/checklist.js"></script></body></html>
