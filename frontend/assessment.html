<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Privacy Assessment</title><link rel="stylesheet" href="/css/style.css"></head>
<body><header id="nav"></header>
<main class="wrap"><div class="wizard">
  <aside class="card steps no-print"><h3>Sections</h3><div id="steps"></div>
    <div class="progress"><i id="bar" style="width:0"></i></div><div class="small muted" id="count"></div>
    <button class="btn sm" id="demoFill" style="margin-top:12px">Fill with demo profile</button></aside>
  <section class="card"><div id="panel"></div>
    <div class="banner" style="margin-top:14px">🔐 Never type phone numbers, addresses or passwords here. You only say whether something is visible or enabled.</div>
    <div class="wiz-foot"><button class="btn" id="back">← Back</button><span class="muted small" id="msg"></span><button class="btn primary" id="next">Next →</button></div></section>
</div></main><div id="footer"></div>
<script src="/js/common.js"></script><script src="/js/assessment.js"></script></body></html>
